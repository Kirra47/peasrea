<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PeasRea — Android reverse engineering, made reproducible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="52%" stop-color="#9BE9FF"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1F6FEB" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <pattern id="gridFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0 H0 V8" fill="none" stroke="#22D3EE" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="358" rx="18"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#gridFine)"/>
    <rect width="1280" height="120" fill="url(#scan)"/>
    <ellipse cx="640" cy="120" rx="520" ry="150" fill="#22D3EE" opacity="0.07" filter="url(#softGlow)"/>
    <ellipse cx="1050" cy="300" rx="240" ry="120" fill="#A78BFA" opacity="0.10" filter="url(#softGlow)"/>
    <rect width="1280" height="360" fill="url(#vignette)"/>

    <!-- 波形装饰 -->
    <path d="M0 322 L96 322 L112 306 L128 338 L144 296 L160 330 L176 314 L192 322 L320 322 L336 310 L352 334 L368 302 L384 328 L400 316 L416 322 L544 322 L560 308 L576 336 L592 300 L608 330 L624 314 L640 322 L768 322 L784 306 L800 338 L816 298 L832 328 L848 316 L864 322 L992 322 L1008 310 L1024 334 L1040 302 L1056 330 L1072 314 L1088 322 L1280 322"
          fill="none" stroke="url(#neon)" stroke-opacity="0.38" stroke-width="1.6"/>
    <path d="M0 336 L1280 336" stroke="#30363D" stroke-opacity="0.7" stroke-width="1"/>

    <!-- HUD 角标 -->
    <g stroke="#22D3EE" stroke-opacity="0.65" stroke-width="2" fill="none">
      <path d="M28 28 h34 M28 28 v34"/>
      <path d="M1252 28 h-34 M1252 28 v34"/>
      <path d="M28 332 h34 M28 332 v-34"/>
      <path d="M1252 332 h-34 M1252 332 v-34"/>
    </g>

    <!-- 顶部角标文字 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7D8590">
      <text x="80" y="46" letter-spacing="1.5">// android · dex · axml · native</text>
      <text x="1200" y="46" text-anchor="end" letter-spacing="1.5">v0.2.0</text>
    </g>
    <circle cx="62" cy="42" r="3.5" fill="#3FB950"/>
    <circle cx="1200" cy="42" r="0" fill="none"/>
  </g>

  <!-- 霓虹边框 -->
  <rect x="1" y="1" width="1278" height="358" rx="18" fill="none" stroke="url(#neon)" stroke-width="1.4" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="1278" height="358" rx="18" fill="none" stroke="url(#neon)" stroke-width="6" stroke-opacity="0.16" filter="url(#glow)"/>

  <!-- 主标题 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <text x="640" y="178" font-size="104" font-weight="800" letter-spacing="14" fill="#22D3EE" opacity="0.35" filter="url(#glow)">PEASREA</text>
    <text x="640" y="178" font-size="104" font-weight="800" letter-spacing="14" fill="url(#titleGrad)">PEASREA</text>

    <!-- Slogan -->
    <text x="640" y="222" font-size="19" letter-spacing="2.2" fill="#9BE9FF" opacity="0.92">Android reverse engineering, made reproducible</text>
    <text x="640" y="250" font-size="17" letter-spacing="1.2" fill="#8B949E">把 18 万类的安卓包拆明白 · 每一步都可复核</text>
  </g>

  <!-- 特性胶囊 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.6">
    <rect x="310" y="286" width="250" height="38" rx="19" fill="#0D1117" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="334" cy="305" r="4" fill="#22D3EE"/>
    <text x="352" y="310" fill="#C9D1D9">DEX · AXML BYTE PATCHING</text>

    <rect x="582" y="286" width="196" height="38" rx="19" fill="#0D1117" fill-opacity="0.72" stroke="#3FB950" stroke-opacity="0.45"/>
    <circle cx="606" cy="305" r="4" fill="#3FB950"/>
    <text x="624" y="310" fill="#C9D1D9">ZERO DEPENDENCIES</text>

    <rect x="800" y="286" width="170" height="38" rx="19" fill="#0D1117" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.45"/>
    <circle cx="824" cy="305" r="4" fill="#A78BFA"/>
    <text x="842" y="310" fill="#C9D1D9">LOCAL FTS5 KB</text>
  </g>
</svg>
